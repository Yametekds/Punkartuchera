<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#232323" />
    <meta name="description" content="Gestor de bandas para Punkapocalyptic" />
    <title>Punkartuchera</title>
    <base href="/" />
    <script>
        // En GitHub Pages la app vive en /<repositorio>/; se ajusta la base para que
        // las rutas y los recursos funcionen igual en local y publicada.
        (function () {
            if (location.hostname.endsWith('github.io')) {
                var segment = location.pathname.split('/')[1];
                if (segment) document.querySelector('base').setAttribute('href', '/' + segment + '/');
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Permanent+Marker&family=Sora:wght@400;500;700&family=Wellfleet&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/punk-theme.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot__title">Punkartuchera</div>
            <div class="boot__bar"><span></span></div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo ha petado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
