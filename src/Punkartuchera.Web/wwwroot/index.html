<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#232323" />
    <meta name="description" content="Gestor de bandas para Punkapocalyptic" />
    <title>Punkartuchera</title>
    <base href="/" />
    <script>
        // En GitHub Pages la app vive en /<repositorio>/; se ajusta la base para que
        // las rutas y los recursos funcionen igual en local y publicada.
        (function () {
            if (location.hostname.endsWith('github.io')) {
                var segment = location.pathname.split('/')[1];
                if (segment) document.querySelector('base').setAttribute('href', '/' + segment + '/');
            }
            // Tamaño de letra y tipografía elegidos en Usuario, antes de pintar nada.
            try {
                var user = JSON.parse(localStorage.getItem('punkartuchera.user') || '{}');
                var scale = Number(user.fontScale);
                if (scale >= 90 && scale <= 150 && scale !== 100) document.documentElement.style.fontSize = scale + '%';
                var font = String(user.font || '').toLowerCase();
                if (font === 'opendyslexic' || font === 'hyperlegible') document.documentElement.dataset.font = font;
            } catch (e) { }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/fonts.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/punk-theme.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/rules.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/roster.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/match.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/tutorials.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/user.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/tournament.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/band-print.css" />
    <link rel="stylesheet" href="_content/Punkartuchera.UI/css/missions.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <div class="boot__plate">
                <img class="boot__logo" src="_content/Punkartuchera.UI/img/logo/punkartuchera-logo-principal.svg" alt="Punkartuchera" width="1102" height="530" />
                <div class="boot__bar"><span></span></div>
                <div class="loading-progress-text"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo ha petado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
