name: Publicar el relé en Azure

# Publica las Azure Functions del relé. Solo corre si el repositorio tiene configuradas
# las variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID y AZURE_FUNCTIONAPP_NAME
# (ver docs/PARTIDAS-EN-LINEA.md). El inicio de sesión es por OpenID Connect: no hay secretos guardados.

on:
  push:
    branches: [main]
    paths:
      - src/Punkartuchera.Relay/**
      - src/Punkartuchera.Relay.Contracts/**
      - .github/workflows/relay.yml
  workflow_dispatch:

# Por defecto nada; el trabajo pide solo lo que usa.
permissions: {}

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: relay
    permissions:
      contents: read
      id-token: write
    steps:
      # Acciones fijadas por commit: una etiqueta se puede mover a otro código, un hash no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Tests del relé
        run: dotnet test tests/Punkartuchera.Relay.Tests --configuration Release

      - name: Compilar
        run: dotnet publish src/Punkartuchera.Relay --configuration Release --output relay

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: relay
          sku: flexconsumption
