name: Publicar el relé en Azure

# Publica las Azure Functions del relé. Solo corre si el repositorio tiene configuradas
# las variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID y AZURE_FUNCTIONAPP_NAME
# (ver docs/PARTIDAS-EN-LINEA.md). El inicio de sesión es por OpenID Connect: no hay secretos guardados.

on:
  push:
    branches: [main]
    paths:
      - src/Punkartuchera.Relay/**
      - src/Punkartuchera.Relay.Contracts/**
      - .github/workflows/relay.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests del relé
        run: dotnet test tests/Punkartuchera.Relay.Tests --configuration Release

      - name: Compilar
        run: dotnet publish src/Punkartuchera.Relay --configuration Release --output relay

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: relay
          sku: flexconsumption
