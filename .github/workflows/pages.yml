name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto nada; cada trabajo pide solo lo que usa.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # Acciones fijadas por commit: una etiqueta se puede mover a otro código, un hash no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test --configuration Release

      - name: Publicar
        run: dotnet publish src/Punkartuchera.Web/Punkartuchera.Web.csproj --configuration Release --output publish

      - name: Comprobar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          ! grep -q "has the following vulnerable packages" vulnerables.txt

      - name: Preparar sitio estático
        run: |
          # Política de seguridad de contenido (CSP) en el index.html, antes de copiarlo a 404.html.
          dotnet run build/csp.cs -- publish/wwwroot/index.html
          # GitHub Pages no conoce las rutas de la SPA: 404.html carga la app igualmente.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
