name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto nada; cada trabajo pide solo lo que usa.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # Acciones fijadas por commit: una etiqueta se puede mover a otro código, un hash no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test --configuration Release

      - name: Dirección del relé
        # Variable del repositorio (Settings → Secrets and variables → Actions → Variables).
        # Sin ella, la app sale sin partidas en línea. Se escribe antes de publicar para que
        # el service worker calcule bien la huella de appsettings.json.
        if: ${{ vars.RELAY_URL != '' }}
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          jq -n --arg url "$RELAY_URL" '{Relay: {BaseUrl: $url}}' > src/Punkartuchera.Web/wwwroot/appsettings.json

      - name: Publicar
        run: dotnet publish src/Punkartuchera.Web/Punkartuchera.Web.csproj --configuration Release --output publish

      - name: Comprobar dependencias vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          ! grep -q "has the following vulnerable packages" vulnerables.txt

      - name: Preparar sitio estático
        run: |
          # Política de seguridad de contenido (CSP) en el index.html, antes de copiarlo a 404.html.
          dotnet run build/csp.cs -- publish/wwwroot/index.html
          # GitHub Pages no conoce las rutas de la SPA: 404.html carga la app igualmente.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
